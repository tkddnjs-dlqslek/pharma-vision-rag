services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: pharma-rag-qdrant
    restart: unless-stopped
    # Ports 6335/6336 (not the Qdrant default 6333/6334) because this host already
    # runs another Qdrant container on 6333 (n8n AI starter kit). Keep the two isolated.
    ports:
      - "6335:6333"   # HTTP REST (host:container) — access at http://localhost:6335
      - "6336:6334"   # gRPC
    volumes:
      # Named volume, NOT a Windows bind mount: with ./data/qdrant_storage every vector in pharma_text
      # came back zero-norm after an unclean host shutdown (2026-09-19). Qdrant documents bind mounts
      # on Windows/WSL as unsafe for its mmap storage.
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
      # Note: do NOT set QDRANT__SERVICE__MAX_REQUEST_SIZE_MB on v1.12.4 —
      # it silently breaks actix workers. Use gRPC (port 6334) for large
      # multi-vector upserts instead; REST is fine for small queries.
      # QDRANT__SERVICE__API_KEY intentionally unset for local dev (no auth needed).

  # ─── Self-hosted MCP service (services/deploy.md) ────────────────────────
  # docker compose --profile serve up -d --build      (the profile keeps `docker compose up -d qdrant` unchanged)
  # Values come from the repo-root .env (compose interpolation), so only the listed keys enter the containers.
  encoders:
    build: services/encoders
    container_name: pharma-rag-encoders
    profiles: [serve]
    restart: unless-stopped
    # no host port: only mcp (compose network) talks to it. Debug: docker compose exec encoders curl localhost:7860/health
    environment:
      ENCODER_TOKEN: ${ENCODER_TOKEN:?set ENCODER_TOKEN in .env}
      # the three models are public: no HF_TOKEN here (a placeholder token in .env would break the download)
    volumes:
      - hf_cache:/data          # 12 GB of weights, downloaded once
    healthcheck:                # "ok" only after all three models are resident (several minutes on a cold volume)
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; sys.exit(json.load(urllib.request.urlopen('http://localhost:7860/health'))['status'] != 'ok')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m

  mcp:
    build:
      context: .                # src/ is copied in; .dockerignore keeps data/ and .venv out
      dockerfile: services/mcp/Dockerfile
    container_name: pharma-rag-mcp
    profiles: [serve]
    restart: unless-stopped
    depends_on: [encoders]
    # no host port: caddy proxies https://$PUBLIC_HOST to it; health is https://$PUBLIC_HOST/health
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      MCP_USER: ${MCP_USER:-}
      MCP_PASSWORD: ${MCP_PASSWORD:-}
      MCP_PUBLIC_URL: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env, e.g. <public-ip>.sslip.io}
      MCP_LOG_PATH: /data/logs/mcp_calls.jsonl   # one JSON line per tool call, in the corpus_data volume (scripts/32)
      ENCODER_URL: http://encoders:7860       # compose network, not the public address
      ENCODER_TOKEN: ${ENCODER_TOKEN:?set ENCODER_TOKEN in .env}
      QDRANT_CLOUD_URL: ${QDRANT_CLOUD_URL:-}
      QDRANT_CLOUD_API_KEY: ${QDRANT_CLOUD_API_KEY:-}
      DATA_REPO: ${DATA_REPO:-sangwongim922/pharma-corpus-data}
      HF_TOKEN: ${HF_TOKEN:-}                 # only needed when DATA_REPO is private; must be a real token or empty
    volumes:
      - corpus_data:/data       # 2.5 GB corpus download + auth.json (OAuth clients and tokens) + logs/

  # Automatic HTTPS in front of mcp (services/caddy/Caddyfile). PUBLIC_HOST=<public-ip>.sslip.io on AWS (scripts/31).
  caddy:
    image: caddy:2-alpine
    container_name: pharma-rag-caddy
    profiles: [serve]
    restart: unless-stopped
    depends_on: [mcp]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env, e.g. <public-ip>.sslip.io}
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates and ACME account: keep it, or a relaunch re-issues against the LE rate limit
      - caddy_config:/config

  # ─── Langfuse (self-host, optional) ─────────────────────────────────────
  # Default path: use Langfuse Cloud (set LANGFUSE_BASE_URL in .env).
  # Uncomment below to self-host instead.
  #
  # langfuse-db:
  #   image: postgres:16-alpine
  #   container_name: pharma-rag-langfuse-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: langfuse
  #     POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
  #     POSTGRES_DB: langfuse
  #   volumes:
  #     - ./data/langfuse_db:/var/lib/postgresql/data
  #
  # langfuse:
  #   image: langfuse/langfuse:2
  #   container_name: pharma-rag-langfuse
  #   depends_on: [langfuse-db]
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/langfuse
  #     NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
  #     SALT: ${LANGFUSE_SALT}
  #     NEXTAUTH_URL: http://localhost:3000
  #     TELEMETRY_ENABLED: "false"
  #     LANGFUSE_INIT_ORG_ID: pharma-rag
  #     LANGFUSE_INIT_PROJECT_ID: pharma-vision-rag

volumes:
  qdrant_storage:
  hf_cache:
  corpus_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: pharma-rag-net
