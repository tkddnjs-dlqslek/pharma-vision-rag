<svg xmlns="http://www.w3.org/2000/svg" style="background:#f7f8f6;font-family:IBM Plex Sans KR, Noto Sans KR, Malgun Gothic, sans-serif" viewBox="0 0 1400 980" role="img" aria-label="사용자가 claude.ai 웹이나 Claude Desktop에서 질문하면, Modal에 있는 MCP 서버가 텍스트 검색(Qdrant Cloud와 BGE-M3, 리랭커), 비전 검색(Nemotron 인코더와 로컬 인덱스), 페이지 렌더를 수행하고, Claude가 페이지 이미지를 읽어 출처와 함께 답한다. 인덱스는 RunPod GPU와 개발 PC에서 한 번 만들어 올린다.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/>
        </marker>
      </defs>

      <!-- ===== Users ===== -->
      <g fill="#5b6770" stroke="none">
        <circle cx="650" cy="46" r="11"/><path d="M628 84 a22 22 0 0 1 44 0 z"/>
        <circle cx="690" cy="46" r="11"/><path d="M668 84 a22 22 0 0 1 44 0 z"/>
        <circle cx="670" cy="38" r="11" fill="#1f2a30"/><path d="M648 76 a22 22 0 0 1 44 0 z" fill="#1f2a30"/>
      </g>
      <text x="670" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a30">사용자 (재무, 마케팅, 영업, 전략)</text>
      <text x="670" y="124" text-anchor="middle" font-size="12" fill="#5b6770">claude.ai 웹, Claude Desktop, Claude Code</text>
      <rect x="760" y="30" width="270" height="86" rx="6" fill="#d9efe9" stroke="#0f7b6c"/>
      <text x="895" y="52" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2a30">Claude = 에이전트 (E4b 구성)</text>
      <text x="895" y="72" text-anchor="middle" font-size="12" fill="#1f2a30">회사, 기간 확인 후 도구 선택</text>
      <text x="895" y="90" text-anchor="middle" font-size="12" fill="#1f2a30">멀티홉 분해, 페이지 이미지 검증</text>
      <text x="895" y="108" text-anchor="middle" font-size="12" fill="#1f2a30">출처(문서 id, 페이지)와 함께 답변</text>

      <!-- Internet cloud -->
      <path d="M600 178 a26 26 0 0 1 48 -14 a30 30 0 0 1 56 8 a22 22 0 0 1 8 42 h-104 a22 22 0 0 1 -8 -36 z" fill="#ffffff" stroke="#8e9aa3"/>
      <text x="656" y="200" text-anchor="middle" font-size="12" fill="#5b6770">Internet (HTTPS)</text>

      <!-- Users -> cloud -> MCP -->
      <g stroke="currentColor" fill="none" marker-end="url(#arrow)" color="#1f2a30">
        <line x1="670" y1="128" x2="670" y2="150"/>
        <path d="M640 214 C 560 240, 420 236, 300 300"/>
      </g>
      <text x="446" y="252" font-size="12" fill="#5b6770">질문 (한국어), OAuth 로그인 뒤 MCP 호출</text>
      <g stroke="#0f7b6c" fill="none" marker-end="url(#arrow-accent)">
        <path d="M470 330 C 560 300, 620 250, 690 216"/>
      </g>
      <text x="586" y="262" font-size="12" fill="#0f7b6c">페이지 이미지 + 텍스트 조각 + 출처</text>

      <!-- ===== Modal region ===== -->
      <rect x="60" y="284" width="860" height="440" rx="10" fill="#eef1ee" stroke="#8e9aa3" stroke-dasharray="7 5"/>
      <text x="80" y="308" font-size="13" font-weight="600" fill="#1f2a30">Modal (서버리스, CPU 컨테이너, 미사용 시 0원, 카드 없이 무료 크레딧)</text>

      <!-- MCP server -->
      <rect x="90" y="326" width="380" height="180" rx="8" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
      <g fill="#0f7b6c"><rect x="106" y="342" width="34" height="8" rx="2"/><rect x="106" y="354" width="34" height="8" rx="2"/><rect x="106" y="366" width="34" height="8" rx="2"/></g>
      <text x="152" y="352" font-size="13" font-weight="600" fill="#1f2a30">pharma-mcp: MCP 서버 (streamable HTTP)</text>
      <text x="152" y="370" font-size="12" fill="#5b6770">mcp_server.py, OAuth 2.1 로그인 + 정적 토큰, 콜드 8초</text>
      <text x="106" y="398" font-size="12" font-weight="600" fill="#1f2a30">도구 5개</text>
      <g class="mono" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#1f2a30">
        <text x="106" y="418">list_documents</text>
        <text x="106" y="436">search_text</text>
        <text x="106" y="454">search_pages</text>
        <text x="106" y="472">open_page</text>
        <text x="106" y="490">calculate</text>
      </g>
      <g font-size="11.5" fill="#5b6770">
        <text x="230" y="418">문서 27개 목록, 회사와 기간으로 좁힘</text>
        <text x="230" y="436">dense + 리랭크 (실패 시 BM25), 0.5~8초</text>
        <text x="230" y="454">페이지 이미지 검색 MaxSim, 3~4초</text>
        <text x="230" y="472">PDF 페이지 렌더 → PNG, 1.5초</text>
        <text x="230" y="490">증감률과 비율 계산</text>
      </g>

      <!-- Volume -->
      <rect x="90" y="530" width="380" height="170" rx="8" fill="#ffffff" stroke="#8e9aa3"/>
      <g stroke="#8e9aa3" fill="#f7f8f6"><path d="M106 550 h26 l10 10 v34 h-36 z"/><path d="M132 550 v10 h10" fill="none"/></g>
      <text x="152" y="558" font-size="13" font-weight="600" fill="#1f2a30">Modal Volume: pharma-corpus-data (2.5GB)</text>
      <text x="152" y="576" font-size="12" fill="#5b6770">서버가 읽기만 하는 데이터</text>
      <g font-size="12" fill="#1f2a30">
        <text x="106" y="606">PDF 27개, 1,709페이지 (99MB)</text>
        <text x="106" y="626">텍스트 청크 15,182개 + BM25 색인</text>
        <text x="106" y="646">비전 인덱스 pooled_int8: 770,759 × 3072 (2.4GB)</text>
        <text x="106" y="666">MaxSim 정확 검색, 문서 필터 시 0.1초</text>
      </g>

      <!-- Vision encoder -->
      <rect x="520" y="326" width="370" height="96" rx="8" fill="#ffffff" stroke="#8e9aa3"/>
      <text x="536" y="350" font-size="13" font-weight="600" fill="#1f2a30">pharma-vision-encoder</text>
      <text x="536" y="370" font-size="12" fill="#1f2a30">nvidia/llama-nemotron-colembed-vl-3b-v2 (CPU 8코어)</text>
      <text x="536" y="388" font-size="12" fill="#5b6770">질문 → 토큰별 3072-d 멀티벡터, 2~4초 (콜드 40초)</text>
      <text x="536" y="406" font-size="12" fill="#5b6770">가중치 7GB는 Volume에 캐시</text>

      <!-- Text models -->
      <rect x="520" y="440" width="370" height="96" rx="8" fill="#ffffff" stroke="#8e9aa3"/>
      <text x="536" y="464" font-size="13" font-weight="600" fill="#1f2a30">pharma-text-models</text>
      <text x="536" y="484" font-size="12" fill="#1f2a30">BAAI/bge-m3: 질문 임베딩 1024-d (코사인)</text>
      <text x="536" y="502" font-size="12" fill="#1f2a30">BAAI/bge-reranker-v2-m3: 후보 30개 재정렬 (4.5초)</text>
      <text x="536" y="520" font-size="12" fill="#5b6770">벤치마크 text_rerank 경로와 동일 (R@5 0.72)</text>

      <!-- Auth dict -->
      <rect x="520" y="556" width="370" height="64" rx="8" fill="#ffffff" stroke="#8e9aa3"/>
      <text x="536" y="580" font-size="13" font-weight="600" fill="#1f2a30">Modal Dict: pharma-mcp-auth</text>
      <text x="536" y="600" font-size="12" fill="#5b6770">OAuth 클라이언트, 인가 코드(5분), 토큰(30일, 갱신 90일)</text>

      <!-- MCP -> components arrows -->
      <g stroke="currentColor" fill="none" marker-end="url(#arrow)" color="#1f2a30">
        <path d="M470 372 H520"/>
        <path d="M470 470 C 500 470, 500 488, 520 488"/>
        <path d="M470 498 C 505 498, 505 588, 520 588"/>
        <path d="M280 506 V530"/>
      </g>
      <text x="476" y="364" font-size="11" fill="#5b6770">인코딩</text>
      <text x="286" y="523" font-size="11" fill="#5b6770">MaxSim, 렌더, BM25</text>

      <!-- ===== Qdrant region ===== -->
      <rect x="960" y="284" width="380" height="200" rx="10" fill="#eef1ee" stroke="#8e9aa3" stroke-dasharray="7 5"/>
      <text x="980" y="308" font-size="13" font-weight="600" fill="#1f2a30">Qdrant Cloud (무료 1GB 클러스터)</text>
      <g fill="#dde8f5" stroke="#3d6ea8" stroke-width="1.5">
        <path d="M1010 356 v70 a60 12 0 0 0 120 0 v-70"/>
        <ellipse cx="1070" cy="356" rx="60" ry="12"/>
      </g>
      <text x="1070" y="396" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2a30">pharma_text_v2</text>
      <text x="1070" y="414" text-anchor="middle" font-size="11.5" fill="#1f2a30">15,182 × 1024, cosine</text>
      <text x="1150" y="356" font-size="12" fill="#1f2a30">payload: source, page,</text>
      <text x="1150" y="374" font-size="12" fill="#1f2a30">context, text, block_index</text>
      <text x="1150" y="400" font-size="12" fill="#5b6770">문서 필터 = payload 조건</text>
      <text x="1150" y="418" font-size="12" fill="#5b6770">왕복 약 0.3초</text>
      <text x="980" y="466" font-size="11.5" fill="#5b6770">비전 멀티벡터(2.4GB)는 무료 티어를 넘어 Volume에 둠</text>

      <g stroke="currentColor" fill="none" marker-end="url(#arrow)" color="#1f2a30">
        <path d="M890 488 C 930 488, 930 400, 1010 400"/>
      </g>
      <text x="906" y="452" font-size="11" fill="#5b6770">dense top-30</text>

      <!-- ===== Offline build region ===== -->
      <rect x="60" y="760" width="1280" height="200" rx="10" fill="#f6e8d2" stroke="#a9640a" stroke-dasharray="7 5"/>
      <text x="80" y="784" font-size="13" font-weight="600" fill="#1f2a30">인덱스 생성 (1회, 오프라인. 질문 시점에는 돌지 않음)</text>

      <rect x="90" y="802" width="400" height="136" rx="8" fill="#ffffff" stroke="#a9640a"/>
      <g fill="#a9640a"><rect x="106" y="818" width="30" height="20" rx="3"/><rect x="112" y="842" width="18" height="6" rx="1"/></g>
      <text x="148" y="826" font-size="13" font-weight="600" fill="#1f2a30">RunPod GPU (RTX 4090, 약 1시간, 약 $1)</text>
      <g font-size="12" fill="#1f2a30">
        <text x="106" y="866">embed_pages_gpu → 24_vision_index_gpu --embed-now</text>
        <text x="106" y="884">페이지 1,709장 → 패치 벡터 → int8 인덱스 9.5GB (R@5 0.875)</text>
        <text x="106" y="902">text_retrieval_gpu: Docling 청크 → BGE-M3 벡터 15,182개</text>
        <text x="106" y="920" fill="#5b6770">교훈: Volume Disk 사용, HF_HUB_OFFLINE=1, datasets 설치</text>
      </g>

      <rect x="540" y="802" width="400" height="136" rx="8" fill="#ffffff" stroke="#a9640a"/>
      <g fill="#a9640a"><rect x="556" y="818" width="30" height="22" rx="3"/><rect x="562" y="844" width="18" height="4" rx="1"/></g>
      <text x="598" y="826" font-size="13" font-weight="600" fill="#1f2a30">개발 PC (RAM 16GB)</text>
      <g font-size="12" fill="#1f2a30">
        <text x="556" y="866">26_pool_local_index: int8 → pooled_int8 2.4GB (12분)</text>
        <text x="556" y="884">29_upload_text_vectors: 벡터 → Qdrant (224초)</text>
        <text x="556" y="902">modal volume put: PDF, 청크, 인덱스 → Volume</text>
        <text x="556" y="920" fill="#5b6770">같은 mcp_server.py를 stdio로 Claude Desktop, Claude Code에 연결</text>
      </g>

      <rect x="990" y="802" width="330" height="136" rx="8" fill="#ffffff" stroke="#a9640a"/>
      <text x="1006" y="826" font-size="13" font-weight="600" fill="#1f2a30">벤치마크 (근거)</text>
      <g font-size="12" fill="#1f2a30">
        <text x="1006" y="850">60문항 × 한/영, blind 채점, 반복 실행</text>
        <text x="1006" y="868">차트 R@5: 비전 0.97, 텍스트 0.72</text>
        <text x="1006" y="886">답변: text 0.59, vision 0.79, E4b 0.89</text>
        <text x="1006" y="904">멀티홉은 에이전트만 안정적 (0.87~0.93)</text>
        <text x="1006" y="922" fill="#5b6770">근거성: 모순 0건 / 95답변</text>
      </g>

      <!-- Offline -> online arrows -->
      <g stroke="#a9640a" fill="none" marker-end="url(#arrow)" color="#a9640a" stroke-dasharray="5 4">
        <path d="M290 802 V700"/>
        <path d="M740 802 C 740 760, 700 740, 470 700"/>
        <path d="M940 870 C 1100 860, 1160 600, 1120 484"/>
      </g>
      <text x="298" y="748" font-size="11" fill="#a9640a">int8 인덱스 다운로드</text>
      <text x="600" y="748" font-size="11" fill="#a9640a">Volume 업로드 2.5GB</text>
      <text x="1160" y="640" font-size="11" fill="#a9640a">벡터 업로드</text>
    </svg>