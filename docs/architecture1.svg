<svg xmlns="http://www.w3.org/2000/svg" style="background:#f7f8f6;font-family:IBM Plex Sans KR, Noto Sans KR, Malgun Gothic, sans-serif" viewBox="0 0 1080 420" role="img" aria-label="사용자, Claude(에이전트), Modal의 MCP 서버, 그리고 서버가 쓰는 세 가지 저장소(Qdrant Cloud 텍스트 벡터, 비전 인덱스, PDF)로 이어지는 전체 구성">
        <defs>
          <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
        </defs>
        <!-- user -->
        <g fill="#1f2a30"><circle cx="90" cy="150" r="16"/><path d="M58 206 a32 32 0 0 1 64 0 z"/></g>
        <text x="90" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2a30">사용자</text>
        <text x="90" y="256" text-anchor="middle" font-size="12" fill="#5b6770">재무, 마케팅, 영업</text>

        <!-- claude -->
        <rect x="190" y="120" width="220" height="130" rx="10" fill="#d9efe9" stroke="#0f7b6c" stroke-width="2"/>
        <text x="300" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2a30">Claude (웹)</text>
        <text x="300" y="186" text-anchor="middle" font-size="13" fill="#1f2a30">에이전트 역할</text>
        <text x="300" y="206" text-anchor="middle" font-size="12" fill="#5b6770">질문 이해, 도구 선택,</text>
        <text x="300" y="224" text-anchor="middle" font-size="12" fill="#5b6770">페이지 읽고 출처 붙여 답변</text>

        <!-- modal region -->
        <rect x="470" y="40" width="580" height="350" rx="12" fill="#eef1ee" stroke="#8e9aa3" stroke-dasharray="7 5"/>
        <text x="490" y="66" font-size="13" font-weight="600" fill="#5b6770">클라우드 (무료 티어)</text>

        <!-- mcp server -->
        <rect x="500" y="120" width="200" height="130" rx="10" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
        <text x="600" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2a30">MCP 서버</text>
        <text x="600" y="184" text-anchor="middle" font-size="12.5" fill="#1f2a30">Modal 위에서 실행</text>
        <text x="600" y="206" text-anchor="middle" font-size="12" fill="#5b6770">도구 5개: 문서 목록, 텍스트 검색,</text>
        <text x="600" y="224" text-anchor="middle" font-size="12" fill="#5b6770">비전 검색, 페이지 열기, 계산</text>

        <!-- three stores -->
        <g fill="#dde8f5" stroke="#3d6ea8" stroke-width="1.5">
          <path d="M800 100 v56 a55 11 0 0 0 110 0 v-56"/><ellipse cx="855" cy="100" rx="55" ry="11"/>
        </g>
        <text x="935" y="118" font-size="13.5" font-weight="600" fill="#1f2a30">텍스트 벡터</text>
        <text x="935" y="136" font-size="12" fill="#5b6770">Qdrant Cloud</text>

        <rect x="800" y="196" width="110" height="60" rx="8" fill="#ffffff" stroke="#8e9aa3"/>
        <g fill="#0f7b6c"><rect x="816" y="212" width="18" height="12" rx="2"/><rect x="838" y="212" width="18" height="12" rx="2"/><rect x="816" y="228" width="18" height="12" rx="2"/><rect x="838" y="228" width="18" height="12" rx="2"/></g>
        <text x="866" y="230" font-size="12" fill="#1f2a30">2.4GB</text>
        <text x="935" y="222" font-size="13.5" font-weight="600" fill="#1f2a30">페이지 이미지 인덱스</text>
        <text x="935" y="240" font-size="12" fill="#5b6770">비전 검색용</text>

        <g stroke="#8e9aa3" fill="#ffffff"><path d="M818 300 h56 l18 18 v54 h-74 z"/><path d="M874 300 v18 h18" fill="none"/></g>
        <text x="855" y="348" text-anchor="middle" font-size="12" fill="#1f2a30">PDF 27개</text>
        <text x="935" y="326" font-size="13.5" font-weight="600" fill="#1f2a30">원본 PDF</text>
        <text x="935" y="344" font-size="12" fill="#5b6770">1,709페이지</text>

        <!-- arrows -->
        <g stroke="currentColor" fill="none" marker-end="url(#a1)" color="#1f2a30" stroke-width="1.5">
          <line x1="128" y1="170" x2="188" y2="170"/>
          <line x1="412" y1="170" x2="498" y2="170"/>
          <path d="M702 160 C 750 160, 750 128, 798 128"/>
          <line x1="702" y1="226" x2="798" y2="226"/>
          <path d="M702 236 C 750 236, 750 336, 800 336"/>
        </g>
        <text x="158" y="160" text-anchor="middle" font-size="11.5" fill="#5b6770">질문</text>
        <text x="455" y="160" text-anchor="middle" font-size="11.5" fill="#5b6770">도구 호출</text>
        <g stroke="#0f7b6c" fill="none" marker-end="url(#a1)" color="#0f7b6c" stroke-width="1.5">
          <path d="M498 200 C 460 200, 450 300, 300 300 C 200 300, 180 260, 130 200"/>
        </g>
        <text x="300" y="322" text-anchor="middle" font-size="11.5" fill="#0f7b6c">페이지 이미지와 출처가 담긴 답변</text>
      </svg>