<svg xmlns="http://www.w3.org/2000/svg" style="background:#f7f8f6;font-family:IBM Plex Sans KR, Noto Sans KR, Malgun Gothic, sans-serif" viewBox="0 0 1080 360" role="img" aria-label="질문이 회사와 기간 확인, 텍스트 검색 또는 이미지 검색, 페이지 열기, 답변의 순서로 처리되는 흐름">
        <defs>
          <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
        </defs>
        <!-- step boxes -->
        <rect x="30" y="140" width="150" height="80" rx="10" fill="#d9efe9" stroke="#0f7b6c" stroke-width="2"/>
        <text x="105" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2a30">질문</text>
        <text x="105" y="197" text-anchor="middle" font-size="12" fill="#5b6770">"Dupixent 2분기 매출은?"</text>

        <rect x="230" y="140" width="170" height="80" rx="10" fill="#ffffff" stroke="#8e9aa3"/>
        <text x="315" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2a30">회사, 기간 확인</text>
        <text x="315" y="192" text-anchor="middle" font-size="12" fill="#5b6770">빠져 있으면 되물음</text>
        <text x="315" y="208" text-anchor="middle" font-size="12" fill="#5b6770">문서 범위를 좁힘</text>

        <rect x="450" y="60" width="200" height="90" rx="10" fill="#ffffff" stroke="#3d6ea8" stroke-width="2"/>
        <text x="550" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2a30">텍스트 검색</text>
        <text x="550" y="112" text-anchor="middle" font-size="12" fill="#5b6770">본문, 표에 강함</text>
        <text x="550" y="130" text-anchor="middle" font-size="12" fill="#5b6770">벡터 검색 후 재정렬</text>

        <rect x="450" y="210" width="200" height="90" rx="10" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
        <text x="550" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2a30">이미지 검색</text>
        <text x="550" y="262" text-anchor="middle" font-size="12" fill="#5b6770">차트, 슬라이드에 강함</text>
        <text x="550" y="280" text-anchor="middle" font-size="12" fill="#5b6770">페이지 그림을 통째로 비교</text>

        <rect x="700" y="140" width="170" height="80" rx="10" fill="#ffffff" stroke="#8e9aa3"/>
        <text x="785" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2a30">페이지 열기</text>
        <text x="785" y="192" text-anchor="middle" font-size="12" fill="#5b6770">이미지로 받아</text>
        <text x="785" y="208" text-anchor="middle" font-size="12" fill="#5b6770">숫자를 눈으로 확인</text>

        <rect x="920" y="140" width="130" height="80" rx="10" fill="#d9efe9" stroke="#0f7b6c" stroke-width="2"/>
        <text x="985" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2a30">답변</text>
        <text x="985" y="197" text-anchor="middle" font-size="12" fill="#5b6770">출처 페이지 포함</text>

        <!-- arrows -->
        <g stroke="currentColor" fill="none" marker-end="url(#a2)" color="#1f2a30" stroke-width="1.5">
          <line x1="182" y1="180" x2="228" y2="180"/>
          <path d="M402 170 C 425 170, 425 105, 448 105"/>
          <path d="M402 190 C 425 190, 425 255, 448 255"/>
          <path d="M652 105 C 675 105, 675 170, 698 170"/>
          <path d="M652 255 C 675 255, 675 190, 698 190"/>
          <line x1="872" y1="180" x2="918" y2="180"/>
        </g>
        <text x="425" y="88" text-anchor="middle" font-size="11.5" fill="#5b6770">둘 다 또는 하나</text>
        <text x="675" y="330" text-anchor="middle" font-size="11.5" fill="#5b6770">회사 비교처럼 여러 번 검색해야 하면 이 과정을 반복</text>
      </svg>