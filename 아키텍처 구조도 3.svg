<svg xmlns="http://www.w3.org/2000/svg" style="background:#f7f8f6;font-family:IBM Plex Sans KR, Noto Sans KR, Malgun Gothic, sans-serif" viewBox="0 0 1080 320" role="img" aria-label="PDF를 GPU에서 페이지 이미지 벡터와 텍스트 벡터로 바꾸고, 압축한 뒤, 클라우드 저장소에 올리는 1회성 흐름">
        <defs>
          <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
        </defs>
        <g stroke="#8e9aa3" fill="#ffffff"><path d="M60 100 h70 l22 22 v76 h-92 z"/><path d="M130 100 v22 h22" fill="none"/></g>
        <text x="106" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a30">PDF 27개</text>
        <text x="106" y="180" text-anchor="middle" font-size="12" fill="#5b6770">1,709페이지</text>

        <rect x="230" y="60" width="240" height="200" rx="10" fill="#f6e8d2" stroke="#a9640a" stroke-width="2"/>
        <text x="350" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2a30">GPU 서버 (RunPod)</text>
        <text x="350" y="112" text-anchor="middle" font-size="12" fill="#5b6770">약 1시간, 약 1달러</text>
        <rect x="250" y="130" width="200" height="50" rx="8" fill="#ffffff" stroke="#8e9aa3"/>
        <text x="350" y="151" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2a30">페이지 이미지 → 벡터</text>
        <text x="350" y="169" text-anchor="middle" font-size="11.5" fill="#5b6770">비전 모델 (Nemotron)</text>
        <rect x="250" y="192" width="200" height="50" rx="8" fill="#ffffff" stroke="#8e9aa3"/>
        <text x="350" y="213" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2a30">텍스트 조각 → 벡터</text>
        <text x="350" y="231" text-anchor="middle" font-size="11.5" fill="#5b6770">텍스트 모델 (BGE-M3)</text>

        <rect x="530" y="60" width="200" height="200" rx="10" fill="#ffffff" stroke="#8e9aa3"/>
        <text x="630" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2a30">개발 PC</text>
        <text x="630" y="112" text-anchor="middle" font-size="12" fill="#5b6770">GPU 없음</text>
        <text x="630" y="156" text-anchor="middle" font-size="12.5" fill="#1f2a30">이미지 벡터 압축</text>
        <text x="630" y="174" text-anchor="middle" font-size="11.5" fill="#5b6770">9.5GB → 2.4GB</text>
        <text x="630" y="214" text-anchor="middle" font-size="12.5" fill="#1f2a30">클라우드에 업로드</text>

        <g fill="#dde8f5" stroke="#3d6ea8" stroke-width="1.5">
          <path d="M820 72 v50 a50 10 0 0 0 100 0 v-50"/><ellipse cx="870" cy="72" rx="50" ry="10"/>
        </g>
        <text x="950" y="90" font-size="13" font-weight="600" fill="#1f2a30">텍스트 벡터</text>
        <text x="950" y="108" font-size="12" fill="#5b6770">Qdrant Cloud</text>

        <rect x="820" y="190" width="100" height="56" rx="8" fill="#ffffff" stroke="#8e9aa3"/>
        <g fill="#0f7b6c"><rect x="834" y="204" width="16" height="11" rx="2"/><rect x="854" y="204" width="16" height="11" rx="2"/><rect x="834" y="219" width="16" height="11" rx="2"/><rect x="854" y="219" width="16" height="11" rx="2"/></g>
        <text x="950" y="212" font-size="13" font-weight="600" fill="#1f2a30">이미지 인덱스, PDF</text>
        <text x="950" y="230" font-size="12" fill="#5b6770">Modal 저장소</text>

        <g stroke="currentColor" fill="none" marker-end="url(#a3)" color="#1f2a30" stroke-width="1.5">
          <line x1="156" y1="160" x2="228" y2="160"/>
          <line x1="452" y1="155" x2="528" y2="155"/>
          <line x1="452" y1="217" x2="528" y2="217"/>
          <path d="M732 140 C 780 140, 780 100, 818 100"/>
          <path d="M732 218 L 818 218"/>
        </g>
        <text x="775" y="86" text-anchor="middle" font-size="11.5" fill="#5b6770">4분</text>
        <text x="775" y="240" text-anchor="middle" font-size="11.5" fill="#5b6770">2.5GB</text>
      </svg>